server:
  port: 18088

spring:
  application:
    name: spring-ai-alibaba-local-chatclient

  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        model: qwen3:4b
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
